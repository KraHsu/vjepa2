app: vjepa_lerobot

nodes: 1
tasks_per_node: 8
cpus_per_task: 8
mem_per_gpu: 80G

folder: /mnt/cpfs/zch/vjepa2_finetune_dlc/lerobot-vitg-256px-8f

meta:
  dtype: bfloat16
  # Fine-tune from base V-JEPA 2 encoder (no AC predictor in this checkpoint)
  pretrain_checkpoint: /mnt/cpfs/zch/vjepa2_pretrain/vitg.pt
  # vitg.pt is a pure pretraining checkpoint; encoder key is "encoder" or "target_encoder"
  context_encoder_key: target_encoder
  target_encoder_key: target_encoder
  # No AC predictor in base checkpoint, always train from scratch
  load_predictor: false
  load_encoder: true
  use_sdpa: true
  sync_gc: true

model:
  model_name: vit_giant_xformers
  pred_depth: 24
  pred_embed_dim: 1024
  pred_num_heads: 16
  pred_is_frame_causal: true
  use_rope: true
  # Activation checkpointing (memory technique, NOT related to action-conditioning).
  # Required: full encoder fwd+bwd over [B=64, 1024 tokens] × 40 ViT-g layers
  # exceeds 96GB H20 without it. Costs ~33% extra compute on bwd recompute.
  use_activation_checkpointing: true
  compile_model: false
  use_extrinsics: false
  action_embed_dim: 102
  state_embed_dim: 102

data:
  data_root: /mnt/cpfs/ego_pretrain/lerobot
  datasets:
    - lerobot_ego4d_cooking_and_cleaning
    - lerobot_egoexo4d
  batch_size: 64
  frames_per_clip: 8
  tubelet_size: 2
  fps: 30
  crop_size: 256
  patch_size: 16
  num_workers: 8
  pin_mem: true
  persistent_workers: true

data_aug:
  horizontal_flip: false
  random_resize_scale: [1.0, 1.0]
  random_resize_aspect_ratio: [0.75, 1.33]
  auto_augment: false
  motion_shift: false
  reprob: 0.0

loss:
  # auto_steps=1 (teacher-forcing only) halves predictor compute. Re-enable AR
  # rollouts later if downstream evals need long-horizon predictor.
  auto_steps: 1
  loss_exp: 1.0
  normalize_reps: true

train_control:
  # Method controls for matrix experiments. target_update=fixed restores the
  # previous frozen-target behavior; ema follows standard JEPA momentum targets.
  target_update: ema
  ema: [0.996, 1.0]
  predictor_warmup_steps: 0
  freeze_encoder_during_predictor_warmup: true
  pause_ema_during_predictor_warmup: true
  log_detailed_wandb: true
  detailed_log_freq: 10
  log_grad_norms: true
  log_param_norms: true
  log_latent_stats: true
  log_input_stats: true

optimization:
  epochs: 100
  ipe: 500
  warmup: 5
  anneal: 10
  lr: 0.000200
  start_lr: 0.000020
  final_lr: 0.0
  weight_decay: 0.04
  final_weight_decay: 0.04
  enc_lr_scale: 0.1
  betas: [0.9, 0.999]
  eps: 1.0e-8
